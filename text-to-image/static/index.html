<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>설명을 그림으로 · SDXL</title><style>
*{box-sizing:border-box}body{background:#f5f6fa;color:#17243b;font-family:system-ui;margin:0}main{max-width:1100px;margin:36px auto;padding:24px}.grid{display:grid;grid-template-columns:350px 1fr;gap:22px}.card{background:white;border:1px solid #e0e5ee;border-radius:16px;padding:22px}textarea,select,input[type=number]{width:100%;padding:12px;border:1px solid #cdd6e4;border-radius:8px;font:inherit}textarea{height:155px;resize:vertical}label{display:block;margin:14px 0 8px;font-size:14px}.row{display:flex;gap:12px}.row>div{flex:1}button,.download{display:inline-block;border:0;border-radius:9px;background:#385edb;color:white;padding:13px 20px;cursor:pointer;text-decoration:none;margin-top:18px}button:disabled{opacity:.5;cursor:wait}.muted{color:#66758b;font-size:13px;line-height:1.6}#status{white-space:pre-wrap;line-height:1.6}#image{width:100%;border-radius:10px}.preview{min-height:420px;display:flex;align-items:center;justify-content:center;background:#f6f8fc;border-radius:12px}.error{color:#b32b40}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;font-size:13px}.hidden{display:none}@media(max-width:750px){.grid{grid-template-columns:1fr}}
</style></head><body><main><h1>설명을 그림으로</h1><p class="muted">장면, 색상, 구도와 화풍을 적어주세요. SDXL이 새로운 이미지를 생성합니다.</p><div class="grid"><section class="card"><label for="prompt">그리고 싶은 이미지</label><textarea id="prompt">몽골 초원 위에 하얀 게르가 있고, 멀리 말들이 달린다. 노을빛이 비치는 따뜻한 수채화.</textarea><label><input id="translate" type="checkbox" checked> 한글 설명을 Gemma로 영어 변환</label><label for="negative">제외할 요소</label><input id="negative" value="blurry, low quality, distorted"><div class="row"><div><label for="size">이미지 크기</label><select id="size"><option value="1024,1024">정사각형 1024 × 1024</option><option value="1024,768">가로형 1024 × 768</option><option value="768,1024">세로형 768 × 1024</option><option value="768,768">정사각형 768 × 768</option></select></div><div><label for="steps">생성 단계</label><input id="steps" type="number" min="10" max="50" value="30"></div></div><label for="seed">Seed (-1이면 무작위)</label><input id="seed" type="number" min="-1" max="2147483647" value="-1"><button id="generate">이미지 생성</button><p id="status" role="status" class="muted">첫 생성은 모델 다운로드와 로딩에 시간이 걸립니다.</p><p class="muted">자동 변환을 끄면 영어 설명을 입력하세요. 생성 작업은 한 번에 하나씩 처리합니다.</p></section><section class="card"><div class="preview"><p id="placeholder" class="muted">생성된 이미지가 여기에 표시됩니다.</p><img id="image" class="hidden" alt="입력한 설명으로 생성한 이미지"></div><a id="download" class="download hidden">PNG 다운로드</a><pre id="details"></pre></section></div></main><script>
const $=id=>document.getElementById(id);let activeJob=sessionStorage.getItem('imageJob');
function status(s,error=false){$('status').textContent=s;$('status').classList.toggle('error',error)}
async function api(path,options){const r=await fetch(path,options);const d=await r.json();if(!r.ok)throw new Error(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail));return d}
async function watch(id){$('generate').disabled=true;try{const d=await api('/api/jobs/'+id);if(d.status==='failed')throw new Error(d.error);if(d.status==='done'){const result=d.result;$('image').src=result.image_url;$('image').classList.remove('hidden');$('placeholder').classList.add('hidden');$('download').href=result.image_url;$('download').classList.remove('hidden');$('details').textContent=`사용 프롬프트: ${result.prompt_used}\n제외 프롬프트: ${result.negative_prompt_used}\nSeed: ${result.seed} · 소요 시간: ${result.seconds}초\n${result.warnings.join('\n')}`;status('이미지 생성 완료');sessionStorage.removeItem('imageJob');$('generate').disabled=false;return}status(d.status==='queued'?'대기 중입니다…':'이미지를 생성하고 있습니다… 첫 작업은 다운로드와 로딩 시간이 포함됩니다.');setTimeout(()=>watch(id),2000)}catch(e){status(e.message+' 새로고침하면 진행 중인 작업 조회를 다시 시도합니다.',true);$('generate').disabled=false}}
$('generate').onclick=async()=>{const prompt=$('prompt').value.trim();if(!prompt){status('이미지 설명을 입력하세요.',true);return}$('generate').disabled=true;status('작업 등록 중…');try{const [width,height]=$('size').value.split(',').map(Number);const d=await api('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,negative_prompt:$('negative').value,translate:$('translate').checked,width,height,steps:Number($('steps').value),seed:Number($('seed').value)})});activeJob=d.job_id;sessionStorage.setItem('imageJob',activeJob);watch(activeJob)}catch(e){status(e.message,true);$('generate').disabled=false}};
api('/health').then(d=>{$('translate').checked=d.translate_default;if(activeJob)watch(activeJob)}).catch(e=>status(e.message,true));
</script></body></html>
