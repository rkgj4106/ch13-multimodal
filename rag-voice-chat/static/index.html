<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>문서와 대화하기 · RAG 음성 챗봇</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#17243b;font-family:system-ui,sans-serif}main{max-width:1100px;margin:40px auto;padding:20px}h1{font-size:28px;margin-bottom:8px}.subtitle{color:#53647b}.grid{display:grid;grid-template-columns:310px 1fr;gap:20px;margin-top:28px}.card{background:white;border:1px solid #dce3ec;border-radius:16px;padding:22px}h2{font-size:18px;margin-top:0}button{border:0;border-radius:8px;padding:11px 16px;background:#245adb;color:white;cursor:pointer}button.secondary{background:#eaf0ff;color:#214886}button:disabled{opacity:.5;cursor:wait}textarea{width:100%;min-height:110px;border:1px solid #c9d3e1;border-radius:10px;padding:14px;font:inherit;resize:vertical}select{max-width:100%;padding:8px;border:1px solid #c9d3e1;border-radius:6px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}.muted{font-size:13px;color:#66758a}.status{white-space:pre-wrap;color:#245adb;font-size:14px;margin:14px 0;min-height:20px}.error{color:#ba283c}.answer{white-space:pre-wrap;line-height:1.8;overflow-wrap:anywhere}.doc{border-bottom:1px solid #e6ebf2;padding:12px 0;overflow-wrap:anywhere}.doc button{padding:5px 10px;margin-top:8px;font-size:12px}details{margin-top:12px;border:1px solid #e2e7ef;padding:12px;border-radius:8px}summary{cursor:pointer;font-size:14px}pre{white-space:pre-wrap;font:inherit;font-size:13px;line-height:1.6}input[type=file]{max-width:100%;font-size:13px}@media(max-width:760px){main{margin:12px auto}.grid{grid-template-columns:1fr}}
</style></head>
<body><main><h1>문서와 대화하기</h1><p class="subtitle">질문을 입력하면 자료에서 답을 찾고, 한국어 음성으로 읽어드립니다.</p>
<div class="grid"><aside class="card"><h2>참고 문서</h2><p class="muted">PDF · TXT · MD / 파일당 20MB<br>스캔 PDF는 OCR 처리 후 등록하세요.</p><input id="files" type="file" accept=".pdf,.txt,.md" multiple><div class="row"><button id="upload">문서 등록</button></div><div id="uploadStatus" class="status" role="status"></div><div id="documents"></div></aside>
<section class="card"><h2>질문하기</h2><textarea id="question" placeholder="예: 등록한 자료에서 Kubernetes Pod 오류 해결 방법을 설명해 줘."></textarea><div class="row"><label><input id="rag" type="checkbox" checked> 문서 RAG 사용</label><label><input id="auto" type="checkbox" checked> 답변 자동 읽기</label></div><div class="row"><button id="ask">질문 보내기</button><button id="read" class="secondary" disabled>답변 읽기</button><button id="stop" class="secondary">읽기 중지</button></div><div class="row"><label for="voice">음성</label><select id="voice"></select></div><p id="voiceStatus" class="muted"></p><div id="status" class="status" role="status"></div><div id="answer" class="answer" aria-live="polite">문서를 등록하고 질문을 입력해 보세요.</div><div id="sources"></div></section></div><p id="models" class="muted"></p></main>
<script>
const $=id=>document.getElementById(id);let answer='',voices=[],speechQueue=[],speechToken=0;
const hasSpeech='speechSynthesis' in window;
function status(id,message,error=false){$(id).textContent=message;$(id).classList.toggle('error',error)}
async function api(path,options={}){const response=await fetch(path,options);let data;try{data=await response.json()}catch{throw new Error(`서버 응답 오류 (${response.status})`)}if(!response.ok)throw new Error(typeof data.detail==='string'?data.detail:JSON.stringify(data.detail));return data}
function setVoices(){if(!hasSpeech){$('voiceStatus').textContent='이 브라우저는 음성 읽기를 지원하지 않습니다.';$('auto').checked=false;return}voices=speechSynthesis.getVoices();const old=$('voice').value;$('voice').replaceChildren();voices.forEach((v,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`${v.name} (${v.lang})`;$('voice').append(o)});const ko=voices.findIndex(v=>v.lang.toLowerCase().startsWith('ko'));if(old!==''&&voices[Number(old)])$('voice').value=old;else if(ko>=0)$('voice').value=ko;$('voiceStatus').textContent=ko>=0?'한국어 음성을 사용할 수 있습니다.':'한국어 음성을 찾지 못했습니다. Windows 언어 설정에서 한국어 음성을 설치한 뒤 브라우저를 다시 실행하세요.'}
function stop(){speechToken++;speechQueue=[];if(hasSpeech)speechSynthesis.cancel()}
function speak(){stop();if(!hasSpeech||!answer)return;const selected=voices[Number($('voice').value)];if(!selected){$('voiceStatus').textContent='사용할 음성이 아직 없습니다. 잠시 후 답변 읽기를 눌러주세요.';return}const clean=answer.replace(/```[\s\S]*?```/g,' 코드 내용은 화면에서 확인해 주세요. ').replace(/\[\d+\]/g,'').replace(/[*#`]/g,'');speechQueue=clean.match(/[^.!?。\n]+[.!?。\n]?/g)||[clean];speechQueue=speechQueue.flatMap(s=>s.match(/[\s\S]{1,180}/g)||[]);const token=speechToken;function next(){if(token!==speechToken||!speechQueue.length)return;const u=new SpeechSynthesisUtterance(speechQueue.shift());u.voice=selected;u.lang=selected.lang;u.rate=1;u.onend=next;u.onerror=e=>{if(token===speechToken&&e.error!=='canceled'&&e.error!=='interrupted')$('voiceStatus').textContent='음성 재생이 중단되었습니다. 답변 읽기 버튼을 눌러 다시 시도하세요.'};window.currentUtterance=u;speechSynthesis.speak(u)}next()}
async function refresh(){const data=await api('/api/documents');$('models').textContent=`답변 모델: ${data.chat_model} · 임베딩 모델: ${data.embed_model}`;$('documents').replaceChildren();if(!data.documents.length){$('documents').textContent='등록된 문서가 없습니다.';return}data.documents.forEach(d=>{const div=document.createElement('div');div.className='doc';const name=document.createElement('strong');name.textContent=d.name;const info=document.createElement('div');info.className='muted';info.textContent=`${d.chunks}개 문단 · ${d.model}`;const del=document.createElement('button');del.textContent='삭제';del.className='secondary';del.onclick=async()=>{if(!confirm(`${d.name} 문서를 삭제할까요?`))return;try{await api(`/api/documents/${d.id}`,{method:'DELETE'});await refresh()}catch(e){status('uploadStatus',e.message,true)}};div.append(name,info,del);$('documents').append(div)})}
$('upload').onclick=async()=>{const files=Array.from($('files').files);if(!files.length){status('uploadStatus','등록할 파일을 선택하세요.',true);return}$('upload').disabled=true;const messages=[];try{for(const file of files){status('uploadStatus',`${file.name} 등록 중… 임베딩 생성에는 시간이 걸릴 수 있습니다.`);const form=new FormData();form.append('file',file);try{const data=await api('/api/documents',{method:'POST',body:form});messages.push(data.message)}catch(e){messages.push(`${file.name}: ${e.message}`)}}await refresh();status('uploadStatus',messages.join('\n'))}catch(e){status('uploadStatus',e.message,true)}finally{$('upload').disabled=false}};
$('ask').onclick=async()=>{const question=$('question').value.trim();if(!question){status('status','질문을 입력하세요.',true);return}stop();answer='';$('read').disabled=true;$('ask').disabled=true;$('answer').textContent='';$('sources').replaceChildren();status('status','관련 자료를 검색하고 답변을 생성하고 있습니다…');try{const data=await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question,use_rag:$('rag').checked,top_k:4})});answer=data.answer;$('answer').textContent=answer;$('read').disabled=!hasSpeech;data.sources.forEach((s,i)=>{const details=document.createElement('details');const summary=document.createElement('summary');summary.textContent=`[${i+1}] ${s.name} · ${s.location} · 유사도 ${s.score.toFixed(3)}`;const text=document.createElement('pre');text.textContent=s.text;details.append(summary,text);$('sources').append(details)});status('status',data.sources.length?`검색한 문단 ${data.sources.length}개를 참고했습니다. 출처를 펼쳐 확인하세요.`:'답변 완료');if($('auto').checked){speak();$('voiceStatus').textContent+=' 자동 재생이 시작되지 않으면 답변 읽기를 눌러주세요.'}}catch(e){status('status',e.message,true)}finally{$('ask').disabled=false}};
$('question').addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='Enter'&&!$('ask').disabled)$('ask').click()});$('read').onclick=speak;$('stop').onclick=stop;if(hasSpeech)speechSynthesis.onvoiceschanged=setVoices;setVoices();refresh().catch(e=>status('uploadStatus',e.message,true));window.addEventListener('beforeunload',stop);
</script></body></html>
